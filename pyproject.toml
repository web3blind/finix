[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "finix"
version = "0.1.0"
description = "Local age-encrypted Hermes profile backup and safe restore"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
finix = "finix.cli:main"

[tool.setuptools.packages.find]
include = ["finix*"]
