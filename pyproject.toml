[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "finix"
version = "0.1.0"
description = "Age-encrypted Hermes profile backup and safe restore on Linux and native Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Publication remains blocked until explicit post-recording user approval.
requires-python = ">=3.11,<3.15"
dependencies = ["PyYAML>=6.0,<7.0", "google-api-python-client>=2.150,<3", "google-auth-oauthlib>=1.2,<2"]

[project.scripts]
finix = "finix.cli:main"

# Hermes OAuth or the explicitly selected external skill owns Google credentials.
[tool.setuptools.packages.find]
include = ["finix*"]

[tool.setuptools.data-files]
"share/finix" = ["plugin.yaml", "__init__.py", "README.md", "LICENSE", "THIRD-PARTY-NOTICES.md"]
"share/finix/finix" = [
  "finix/__init__.py", "finix/__main__.py", "finix/assets.py", "finix/backup_jobs.py",
  "finix/cli.py", "finix/cloud_files.py", "finix/connect_cli.py", "finix/connect_commands.py",
  "finix/connection_worker.py", "finix/connections.py", "finix/connector_drive.py", "finix/core.py",
  "finix/default_recovery.py", "finix/sqlite_family.py", "finix/default_recovery_lifecycle.py",
  "finix/default_recovery_worker.py", "finix/default_recovery_api.py",
  "finix/preview_budget.py", "finix/default_preview_jobs.py", "finix/default_preview_cli.py", "finix/default_preview_worker.py",
  "finix/portable_history.py", "finix/recovery_operations.py", "finix/recovery_pipeline.py",
  "finix/recovery_shared_host.py", "finix/runtime_attempt.py", "finix/custody_payload.py",
  "finix/drive.py", "finix/extra_sources.py", "finix/integration.py", "finix/plugin_cli.py",
  "finix/rclone_storage.py", "finix/recovery.py", "finix/recovery_activation.py", "finix/recovery_api.py",
  "finix/recovery_contract.py", "finix/recovery_http.py", "finix/recovery_import.py", "finix/recovery_sources.py",
  "finix/scheduler.py", "finix/setup_errors.py", "finix/setup_flow.py", "finix/streaming.py",
  "finix/telegram_menu.py", "finix/windows_native.py", "finix/workspace_drive.py", "finix/workspace_helper.py",
  "finix/workspace_skill_transport.py", "finix/workspace_skill_worker.py"
]
"share/finix/dashboard" = ["dashboard/manifest.json", "dashboard/plugin_api.py", "dashboard/index.js"]
"share/finix/desktop" = ["desktop/plugin.js", "desktop/SDK-CONTRACT.md"]
"share/finix/desktop/src" = ["desktop/src/default-maintenance.mjs", "desktop/src/i18n.mjs", "desktop/src/messages.mjs", "desktop/src/cloud.mjs", "desktop/src/plugin.mjs", "desktop/src/recovery.mjs", "desktop/src/recovery-operation.mjs", "desktop/src/setup.mjs"]
"share/finix/docs" = ["docs/setup-flow.md", "docs/INSTALL-LINUX.md", "docs/INSTALL-WINDOWS.md", "docs/SAFETY.md", "docs/RELEASE.md", "docs/recovery-import.md", "docs/default-maintenance-workflow.md", "docs/RESTORE.md", "docs/BACKUP-JOBS.md", "docs/BACKUP-JOBS-UI.md", "docs/google-workspace-skill.md"]
"share/finix/dist" = ["dist/keygen.html"]
