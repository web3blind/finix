name: Finix public-API validation
on:
  push:
    branches: [fix/catalog-public-api-20261115]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finix-public-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install isolated test dependency
        run: python -m pip install "PyYAML>=6.0,<7.0"
      - name: Diagnose native locale fixture
        run: python .github/locale-fixture-diagnostic.py
      - name: Owner chat reply language regression
        run: python -m unittest discover -s tests -p test_connect_reply_language.py -v
      - name: Network-denied offline packaging gate
        run: python scripts/release/offline_gate.py --scratch "${{ runner.temp }}"
      - name: English-default Desktop contract
        run: node --experimental-vm-modules --test tests-desktop/i18n-default.test.mjs
