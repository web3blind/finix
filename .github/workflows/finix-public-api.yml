name: Finix public-API validation
on:
  push:
    branches: [fix/catalog-public-api-20261115]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finix-public-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install isolated test dependencies
        run: python -m pip install "PyYAML>=6.0,<7.0" "pytest>=8,<9" "fastapi>=0.115,<1" "httpx>=0.27,<1" "python-multipart>=0.0.20,<1"
      - name: Rebuild Desktop from reviewed sources
        run: |
          npm ci
          node scripts/build-desktop.mjs
          git diff --exit-code -- desktop/plugin.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finix-desktop-${{ runner.os }}-${{ github.sha }}
          path: desktop/plugin.js
          if-no-files-found: error
          retention-days: 7
      - name: Public boundary and ownership regressions
        env:
          # Runner metadata is trusted; no event text enters shell commands.
          TMPDIR: ${{ runner.temp }}
        run: python -m pytest -q --capture=tee-sys tests/test_connect_reply_language.py tests/test_workspace_skill_selection.py tests/test_removed_transport_setup.py tests/test_public_namespace.py tests/test_public_recovery_unavailable.py tests/test_recovery_catalog_history.py tests/test_windows_private_owner.py
      - name: Existing native Windows publication and ACL regressions
        if: runner.os == 'Windows'
        env:
          TMPDIR: ${{ runner.temp }}
        # This unittest-only file imports its backend inside test methods. Pytest
        # otherwise imports the root SDK entry as `finix` before the real package.
        run: python -m unittest discover -s tests -p test_native_windows.py -k test_directory_delete_child_acl_is_untrusted -k test_private_directory_rejects_broad_acl -k test_publication_does_not_replace_existing_destination
      - name: PM runtime alias capture and preservation regressions
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -m unittest discover -s tests -p test_pm_runtime_aliases.py
      - name: Google upload-session credential boundaries
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -m unittest discover -s tests -p test_drive_session_credential.py
      - name: Network-denied offline packaging gate
        run: python scripts/release/offline_gate.py --scratch "${{ runner.temp }}"
      - name: Real age backup and inert restore regressions on Linux
        if: runner.os == 'Linux'
        env:
          TMPDIR: ${{ runner.temp }}
          FINIX_PREVIEW_TEST_ROOT: ${{ runner.temp }}/finix-cancellation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
          age --version
          python -m pytest -q tests/test_core.py tests/test_core_review.py tests/test_streaming.py tests/test_default_preview_budget.py
      - name: Desktop locale, transport and recovery contracts
        run: node --experimental-vm-modules --test tests-desktop/i18n-default.test.mjs tests-desktop/workspace-skill-ui.test.mjs tests-desktop/public-recovery-unavailable.test.mjs
  sdk-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build the actual Desktop payload
        run: |
          npm ci
          node scripts/build-desktop.mjs
          git diff --exit-code -- desktop/plugin.js
          python -c "import shutil; shutil.rmtree('node_modules')"
      - name: Validate with released Hermes and its package manager
        shell: bash
        env:
          # Isolated synthetic homes, never the controller's live profile.
          HOME: ${{ runner.temp }}/finix-ci-user
          HERMES_HOME: ${{ runner.temp }}/finix-ci-user/.hermes
          HERMES_RUNTIME_DIR: ${{ runner.temp }}/finix-sdk-runtime
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          git clone --depth 1 --branch v0.23.1 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-sdk"
          cd "$RUNNER_TEMP/hermes-sdk"
          test "$(git rev-parse HEAD)" = 3b421578588243f920886e6fe79a6faa87ea026e
          bash scripts/run-in-hermes-env python hermes profile create finix-ci --no-alias --no-skills
          bash scripts/run-in-hermes-env python "$GITHUB_WORKSPACE/.github/public-sdk-probe.py" --project "$GITHUB_WORKSPACE"
          bash scripts/run-in-hermes-env python hermes plugins validate "$GITHUB_WORKSPACE" --install-deps --json | tee "$RUNNER_TEMP/finix-sdk-validation.json"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["ok"] is True; checks={c["name"]:c["ok"] for c in d["checks"]}; assert checks["no core override"] is True and checks["desktop surface"] is True; print("RELEASED_SDK_VALIDATION_FIELDS_OK")' "$RUNNER_TEMP/finix-sdk-validation.json"
      - name: Real SDK portable-history preparation without retired runtime fixtures
        if: runner.os == 'Linux'
        shell: bash
        env:
          HOME: ${{ runner.temp }}/finix-ci-user
          HERMES_HOME: ${{ runner.temp }}/finix-ci-user/.hermes
          HERMES_RUNTIME_DIR: ${{ runner.temp }}/finix-sdk-runtime
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hermes-sdk"
          bash scripts/run-in-hermes-env python -m pm.build_env --source . --out "$RUNNER_TEMP/finix-sdk-test-base" --group dev --group test
          # Rebuild a separate test environment through PM, with the plugin's
          # declared PyYAML dependency. Never pip-mutate either SDK environment.
          "$RUNNER_TEMP/finix-sdk-test-base/bin/python" -c 'import importlib.metadata as m; from pathlib import Path; import sys; Path(sys.argv[1]).write_text("\n".join(sorted(d.metadata["Name"] + "==" + d.version for d in m.distributions() if d.metadata["Name"].lower().replace("_", "-") != "hermes-agent")) + "\n")' "$RUNNER_TEMP/finix-sdk-test-requirements.txt"
          bash scripts/run-in-hermes-env python -m pm.build_env --requirements "$RUNNER_TEMP/finix-sdk-test-requirements.txt" --requirement "PyYAML>=6.0,<7.0" --lock uv.lock --out "$RUNNER_TEMP/finix-sdk-tests"
          HERMES_PYTHON="$RUNNER_TEMP/finix-sdk-tests/bin/python" scripts/run_tests.sh "$GITHUB_WORKSPACE/tests/test_portable_history.py" "$GITHUB_WORKSPACE/tests/test_drive.py" -- -o "pythonpath=$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: finix-sdk-validation-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/finix-sdk-validation.json
          if-no-files-found: warn
          retention-days: 7
